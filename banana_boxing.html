<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banana Boxing</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family: system-ui, sans-serif; color:#fff; }
canvas { display:block; }

/* Language selector */
#lang-selector {
  position:fixed; top:10px; right:10px; z-index:100;
  display:flex; gap:5px;
}
#lang-selector button {
  padding:6px 12px; border:1px solid rgba(255,255,255,0.3);
  border-radius:6px; background:rgba(255,255,255,0.1);
  color:#fff; cursor:pointer; font-size:12px;
}
#lang-selector button.active {
  background:rgba(100,100,255,0.4);
  border-color:rgba(100,100,255,0.8);
}

/* Controls panel */
#controls {
  position:fixed; top:10px; left:10px; z-index:100;
  display:flex; flex-direction:column; gap:8px;
}
.ctrl-btn {
  padding:10px 16px; border:1px solid rgba(255,255,255,0.3);
  border-radius:8px; background:rgba(0,0,0,0.6);
  color:#fff; cursor:pointer; font-size:13px;
  backdrop-filter:blur(4px);
}
.ctrl-btn:hover { background:rgba(50,50,50,0.8); }
.ctrl-btn.connected { border-color:#5f5; color:#5f5; }
.ctrl-btn.loaded { border-color:#88f; color:#88f; }

/* HP Bar */
#hp-container {
  position:fixed; top:80px; left:50%; transform:translateX(-50%);
  text-align:center; z-index:50;
}
#hp-label {
  font-size:14px; color:rgba(255,255,255,0.7);
  margin-bottom:4px;
}
#hp-bar-bg {
  position:relative;
  width:300px; height:24px; background:rgba(0,0,0,0.5);
  border-radius:12px; border:2px solid rgba(255,255,255,0.3);
  overflow:hidden;
}
#hp-bar {
  height:100%; width:100%; background:linear-gradient(90deg, #ff4444, #ff8844);
  border-radius:10px; transition:width 0.2s;
}
#hp-text {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  font-size:14px; font-weight:700; text-shadow:0 1px 2px #000;
  white-space:nowrap;
}

/* Critical hit */
#critical-hit {
  position:fixed; top:40%; left:50%;
  transform:translate(-50%,-50%) scale(0);
  font-size:48px; font-weight:700;
  color:#ff0000; 
  pointer-events:none; z-index:70;
  opacity:0; text-align:center;
  text-shadow: 0 0 30px #ff0000, 0 0 60px #ff4400;
  animation-fill-mode: forwards;
}
#critical-hit.show {
  animation: criticalPop 1.5s ease-out;
}
@keyframes criticalPop {
  0% { transform:translate(-50%,-50%) scale(0); opacity:0; }
  15% { transform:translate(-50%,-50%) scale(1.3); opacity:1; }
  30% { transform:translate(-50%,-50%) scale(1); opacity:1; }
  100% { transform:translate(-50%,-50%) scale(1); opacity:0; }
}

/* Hit indicator */
#hit-indicator {
  position:fixed; top:50%; left:50%;
  transform:translate(-50%,-50%) scale(0);
  font-size:64px; font-weight:700;
  pointer-events:none; z-index:60;
  opacity:0; text-align:center;
  text-shadow: 0 0 30px currentColor;
}

/* Combo */
#combo-container {
  position:fixed; top:120px; right:20px;
  text-align:center; z-index:50;
}
#combo-count {
  font-size:48px; font-weight:700; color:#ffcc00;
  text-shadow: 0 0 20px #ff8800;
}
#combo-label {
  font-size:12px; color:rgba(255,255,255,0.6);
  text-transform:uppercase;
}

/* Victory/Defeat */
#game-over {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.8);
  align-items:center; justify-content:center;
  flex-direction:column; gap:20px; z-index:200;
}
#game-over.show { display:flex; }
#game-over h1 { font-size:64px; }
#game-over button {
  padding:15px 40px; font-size:18px;
  border:none; border-radius:30px;
  background:#fff; color:#000;
  cursor:pointer; font-weight:600;
}

/* Damage flash */
#damage-flash {
  position:fixed; inset:0; pointer-events:none; z-index:40;
  background:rgba(255,0,0,0);
}
</style>
</head>
<body>

<div id="lang-selector">
  <button onclick="setLang('en')" id="lang-en">EN</button>
  <button onclick="setLang('ru')" id="lang-ru">RU</button>
  <button onclick="setLang('zh')" id="lang-zh">中文</button>
</div>

<div id="controls">
  <input type="file" id="file-input" accept=".json" style="display:none" onchange="loadModel(event)">
  <button class="ctrl-btn" id="dataset-btn" onclick="document.getElementById('file-input').click()" data-i18n="loadModel">
    🧠 Загрузить TF модель
  </button>
  <button class="ctrl-btn" id="ble-btn" onclick="connectBLE()" data-i18n="connectController">
    🎮 Подключить контроллер
  </button>
</div>

<div id="hp-container">
  <div id="hp-label">🍌 BANANA</div>
  <div id="hp-bar-bg">
    <div id="hp-bar"></div>
    <div id="hp-text">1000 / 1000</div>
  </div>
</div>

<div id="combo-container">
  <div id="combo-count">0</div>
  <div id="combo-label">COMBO</div>
</div>

<div id="hit-indicator"></div>
<div id="critical-hit">💥 CRITICAL HIT! 💥</div>
<div id="damage-flash"></div>

<div id="game-over">
  <h1 id="game-over-title">🏆 ПОБЕДА!</h1>
  <button onclick="restartGame()" data-i18n="playAgain">Играть снова</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('#lang-selector button').forEach(btn => {
    btn.classList.toggle('active', btn.id === 'lang-' + lang);
  });
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (translations[lang][key]) el.textContent = translations[lang][key];
  });
}

function t(key) {
  return translations[currentLang][key] || translations['en'][key] || key;

sand.position.y = 0.01;
scene.add(sand);

scene.add(ringFloor);

const ropeMat = new THREE.MeshLambertMaterial({ color: 0xff0000 });
[[-3, 0], [3, 0], [0, -3], [0, 3]].forEach(([x, z]) => {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2, 8), ringMat);
  post.position.set(x, 1.3, z);
  scene.add(post);
});

// Custom parser for JSON model
function parseModel(json) {
  // Parse geometries
  const geometries = {};
  json.geometries.forEach(g => {
    let geom;
    if (g.type === 'CapsuleGeometry') {
      // r152 uses (radius, length, capSegments, radialSegments)
      geom = new THREE.CapsuleGeometry(g.radius, g.length || g.height || 1, g.capSegments || 4, g.radialSegments || 8);
    } else if (g.type === 'SphereGeometry') {
      geom = new THREE.SphereGeometry(g.radius, g.widthSegments || 32, g.heightSegments || 16);
    } else if (g.type === 'LatheGeometry') {
      // Convert points to Vector2
      const points = g.points.map(p => new THREE.Vector2(p.x, p.y));
      geom = new THREE.LatheGeometry(points, g.segments || 12, g.phiStart || 0, g.phiLength || Math.PI * 2);
    }
    if (geom) geometries[g.uuid] = geom;
  });
  
  // Parse materials
  const materials = {};
  json.materials.forEach(m => {
    const mat = new THREE.MeshStandardMaterial({
      color: m.color,
      roughness: m.roughness !== undefined ? m.roughness : 1,
      metalness: m.metalness !== undefined ? m.metalness : 0,
      side: m.side === 2 ? THREE.DoubleSide : THREE.FrontSide
    });
    materials[m.uuid] = mat;
  });
  
  // Parse object tree
  function parseObject(obj) {
    let result;
    
    if (obj.type === 'Group') {
      result = new THREE.Group();
    } else if (obj.type === 'Mesh') {
      const geom = geometries[obj.geometry];
      const mat = materials[obj.material];
      if (geom && mat) {
        result = new THREE.Mesh(geom, mat);
      } else {
        result = new THREE.Group();
      }
    } else {
      result = new THREE.Object3D();
    }
    
    result.name = obj.name || '';
    
    // Apply matrix transform
    if (obj.matrix) {
      const m = new THREE.Matrix4();
      m.fromArray(obj.matrix);
      result.applyMatrix4(m);
    }
    
    // Parse children
    if (obj.children) {
      obj.children.forEach(child => {
        result.add(parseObject(child));
      });
    }
    
    return result;
  }
  
  return parseObject(json.object);
}

const particles = [];

function spawnParticles(position, count = 8) {
  for (let i = 0; i < count; i++) {
    const size = 0.015 + Math.random() * 0.025;
    const particle = new THREE.Mesh(
      new THREE.SphereGeometry(size, 6, 6),
      particleMat
    );
    
    particle.position.copy(position);
    particle.userData = {
      velocity: new THREE.Vector3(
        (Math.random() - 0.5) * 0.12,
        Math.random() * 0.08 + 0.04,
        (Math.random() - 0.5) * 0.08 + 0.08
      ),
      life: 1.0
    };
    
    scene.add(particle);
    particles.push(particle);
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const data = p.userData;
    
    p.position.add(data.velocity);
    data.velocity.y -= 0.006; // gravity
    
    data.life -= 0.035;
    p.scale.setScalar(Math.max(0, data.life));
    
    if (data.life <= 0) {
      scene.remove(p);
      particles.splice(i, 1);
    }
  }
}

// SOUND EFFECTS

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playHitSound(type) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const osc2 = audioCtx.createOscillator();
  const gain2 = audioCtx.createGain();
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc2.connect(gain2);
  gain2.connect(audioCtx.destination);
  
  if (type === 'strong') {
    // Heavy thud + low rumble
    osc.frequency.value = 80;
    osc.type = 'sawtooth';
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.setTargetAtTime(0.01, audioCtx.currentTime + 0.08, 0.04);
    
    osc2.frequency.value = 150;
    osc2.type = 'square';
    gain2.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain2.gain.setTargetAtTime(0.01, audioCtx.currentTime + 0.05, 0.03);
    
    osc2.start();
    osc2.stop(audioCtx.currentTime + 0.12);
  } else if (type === 'hook') {
    // Sharp whack
    osc.frequency.value = 200;
    osc.type = 'square';
    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    gain.gain.setTargetAtTime(0.01, audioCtx.currentTime + 0.04, 0.025);
  } else {
    // Normal punch - quick pop
    osc.frequency.value = 300;
    osc.type = 'triangle';
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.setTargetAtTime(0.01, audioCtx.currentTime + 0.03, 0.02);
  }
  
  osc.start();
  osc.stop(audioCtx.currentTime + 0.15);
}

function playWhooshSound() {
  const bufferSize = audioCtx.sampleRate * 0.08;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  
  for (let i = 0; i < bufferSize; i++) {
    const t = i / bufferSize;
    data[i] = (Math.random() - 0.5) * (1 - t) * 0.2 * Math.sin(t * 20);
  }
  
  const source = audioCtx.createBufferSource();
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 800;
  
  source.buffer = buffer;
  source.connect(filter);
  filter.connect(audioCtx.destination);
  source.start();
}

// ══════════════════════════════════════════════════════════════════════════════
// CRITICAL HIT COMBO SYSTEM
// ══════════════════════════════════════════════════════════════════════════════
const CRITICAL_WINDOW = 7000; // 7 seconds
const CRITICAL_BONUS = 50;
const hitHistory = []; // { type: 'jab'|'hook', time: timestamp }

function checkCriticalCombo() {
  const now = performance.now();
  // Remove old hits
  while (hitHistory.length > 0 && now - hitHistory[0].time > CRITICAL_WINDOW) {
    hitHistory.shift();
  }
  
  // Count jabs and hooks in window
  let jabs = 0, hooks = 0;
  hitHistory.forEach(h => {
    if (h.type === 'jab') jabs++;
    else if (h.type === 'hook') hooks++;
  });
  
  // 2 jabs + 1 hook = critical
  if (jabs >= 2 && hooks >= 1) {
    // Clear history to prevent repeated criticals
    hitHistory.length = 0;
    return true;
  }
  return false;
}

function showCriticalHit() {
  const el = document.getElementById('critical-hit');
  el.textContent = t('criticalHit');
  el.classList.remove('show');
  void el.offsetWidth; // Reflow
  el.classList.add('show');
  
  // Apply critical damage
  bananaHP -= CRITICAL_BONUS;
  updateHP();
}

// GAME STATE
// ══════════════════════════════════════════════════════════════════════════════
let bananaHP = 1000;
const MAX_HP = 1000;
let gameOver = false;

// Combo
let comboCount = 0;
let lastComboTime = 0;
const COMBO_TIMEOUT = 1500;

// Damage values
const DAMAGE = {
  'jab_right': 20,
  'jab_left': 20,
  'hook_right': 35,
  'hook_left': 35
};

function updateHP() {
  const pct = Math.max(0, bananaHP / MAX_HP * 100);
  document.getElementById('hp-bar').style.width = pct + '%';
  document.getElementById('hp-text').textContent = `${Math.max(0, bananaHP)} / ${MAX_HP}`;
  
  if (bananaHP <= 0 && !gameOver) {
    gameOver = true;
    document.getElementById('game-over-title').textContent = t('victory');
    document.getElementById('game-over').classList.add('show');
  }
}

function dealDamage(gesture) {
  if (gameOver) return;
  
  const dmg = DAMAGE[gesture] || 0;
  if (dmg === 0) return;
  
  bananaHP -= dmg;
  updateHP();
  
  // Combo
  const now = performance.now();
  if (now - lastComboTime > COMBO_TIMEOUT) {
    comboCount = 0;
  }
  comboCount++;
  lastComboTime = now;
  updateCombo();
  
  // Visual feedback
  showHitEffect(gesture, dmg);
  punchAnimation(gesture);
  bananaTakeHit();
}

function updateCombo() {
  const el = document.getElementById('combo-count');
  el.textContent = comboCount;
  
  if (comboCount >= 10) {
    el.style.color = '#ff4444';
  } else if (comboCount >= 5) {
    el.style.color = '#ffcc00';
  } else {
    el.style.color = '#ffffff';
  }
}

function showHitEffect(gesture, dmg) {
  const ind = document.getElementById('hit-indicator');
  const gestureNames = {
    'strong_right': '👊➡️',
    'strong_left': '⬅️👊',
    'normal_right': '✊➡️',
    'normal_left': '⬅️✊',
    'hook_right': '🪝➡️',
    'hook_left': '⬅️🪝'
  };
  
  ind.innerHTML = `${gestureNames[gesture] || '👊'}<br><span style="font-size:32px;color:#ff4444">-${dmg}</span>`;
  ind.style.color = '#ffcc00';
  ind.style.transform = 'translate(-50%,-50%) scale(1)';
  ind.style.opacity = '1';
  
  setTimeout(() => {
    ind.style.transform = 'translate(-50%,-50%) scale(0.5)';
    ind.style.opacity = '0';
  }, 400);
  
  // Damage flash
  const flash = document.getElementById('damage-flash');
  flash.style.background = 'rgba(255,100,0,0.3)';
  setTimeout(() => flash.style.background = 'rgba(255,0,0,0)', 100);
}

function punchAnimation(gesture) {
  const isLeft = gesture.includes('left');
  const glove = isLeft ? leftPlayerGlove : rightPlayerGlove;
  const state = isLeft ? gloveState.left : gloveState.right;
  
  if (state.punching) return;
  state.punching = true;
  
  // Determine target based on gesture type
  // Model eye positions (scaled 0.5): left eye ~-0.07, right eye ~0.09
  let punchTarget;
  let hitType;
  
  if (gesture.includes('jab')) {
    // Jab right → right eye of opponent (positive X)
    // Jab left → left eye of opponent (negative X)
    punchTarget = new THREE.Vector3(
      isLeft ? -0.07 : 0.09,  // eye positions
      1.75 + bananaGroup.position.y,  // eye height
      0.2
    );
    hitType = 'jab';
  } else if (gesture.includes('hook')) {
    // Hook right → right side (positive X) of opponent body
    // Hook left → left side (negative X) of opponent body
    punchTarget = new THREE.Vector3(
      isLeft ? -0.25 : 0.25,  // same side as punch hand
      1.3 + bananaGroup.position.y,  // body center height
      0.25
    );
    hitType = 'hook';
  } else {
    // Default
    punchTarget = new THREE.Vector3(
      isLeft ? -0.05 : 0.05,
      1.5 + bananaGroup.position.y,
      0.3
    );
    hitType = 'jab';
  }
  
  // Track hit for critical combo
  hitHistory.push({ type: hitType, time: performance.now() });
  
  const startPos = glove.position.clone();
  const startTime = performance.now();
  const forwardDuration = 100;  // Fast punch
  const returnDuration = 150;   // Slower return
  
  // Play whoosh sound at start
  playWhooshSound();
  
  function animatePunch() {
    const elapsed = performance.now() - startTime;
    const totalDuration = forwardDuration + returnDuration;
    
    if (elapsed < forwardDuration) {
      // Forward - fast
      const t = elapsed / forwardDuration;
      const easeOut = 1 - Math.pow(1 - t, 3); // ease out
      glove.position.lerpVectors(startPos, punchTarget, easeOut);
    } else if (elapsed < totalDuration) {
      // Hit moment - spawn particles and play sound
      if (elapsed - forwardDuration < 20) {
        spawnParticles(punchTarget.clone().add(new THREE.Vector3(0, 0, 0.1)), 10);
        playHitSound(hitType);
        
        // Check for critical combo
        if (checkCriticalCombo()) {
          showCriticalHit();
        }
      }
      
      // Return - slower
      const t = (elapsed - forwardDuration) / returnDuration;
      const easeIn = t * t; // ease in
      glove.position.lerpVectors(punchTarget, state.returnPos, easeIn);
    }
    
    if (elapsed < totalDuration) {
      requestAnimationFrame(animatePunch);
    } else {
      glove.position.copy(state.returnPos);
      state.punching = false;
    }
  }
  
  animatePunch();
}

function bananaTakeHit() {
  // Shake banana
  const startTime = performance.now();
  const duration = 200;
  const originalPos = bananaGroup.position.clone();
  
  function shake() {
    const elapsed = performance.now() - startTime;
    const progress = elapsed / duration;
    
    if (progress < 1) {
      bananaGroup.position.x = originalPos.x + Math.sin(progress * Math.PI * 4) * 0.1 * (1 - progress);
      bananaGroup.rotation.z = Math.sin(progress * Math.PI * 3) * 0.1 * (1 - progress);
      requestAnimationFrame(shake);
    } else {
      bananaGroup.position.copy(originalPos);
      bananaGroup.rotation.z = 0;
    }
  }
  shake();
}

function restartGame() {
  bananaHP = MAX_HP;
  gameOver = false;
  comboCount = 0;
  updateHP();
  updateCombo();
  document.getElementById('game-over').classList.remove('show');
}

// ══════════════════════════════════════════════════════════════════════════════
// TENSORFLOW RECOGNITION
// ══════════════════════════════════════════════════════════════════════════════
let tfModel = null;
let modelLoaded = false;

// No noise class - use confidence threshold instead
const GESTURE_TYPES = ['jab_right', 'jab_left', 'hook_right', 'hook_left'];
const WINDOW_SIZE = 50;
const BUFFER_SIZE = 50;
const buffer = { gx: [], gy: [], gz: [], ax: [], ay: [], az: [] };

// Confidence and energy thresholds
const CONFIDENCE_THRESHOLD = 0.70;
const MARGIN_THRESHOLD = 0.15;
const MIN_PEAK_ENERGY = 400;
let peakEnergy = 0;

// Feature count: 50 timesteps * 6 axes + 12 statistical features = 312
const NUM_FEATURES = WINDOW_SIZE * 6 + 12;

function createTFModel() {
  const numClasses = GESTURE_TYPES.length;
  
  const model = tf.sequential({
    layers: [
      tf.layers.dense({ inputShape: [NUM_FEATURES], units: 128, activation: 'relu', kernelRegularizer: tf.regularizers.l2({l2: 0.001}) }),
      tf.layers.batchNormalization(),
      tf.layers.dropout({ rate: 0.4 }),
      tf.layers.dense({ units: 64, activation: 'relu', kernelRegularizer: tf.regularizers.l2({l2: 0.001}) }),
      tf.layers.batchNormalization(),
      tf.layers.dropout({ rate: 0.3 }),
      tf.layers.dense({ units: 32, activation: 'relu' }),
      tf.layers.dropout({ rate: 0.2 }),
      tf.layers.dense({ units: numClasses, activation: 'softmax' })
    ]
  });
  
  model.compile({
    optimizer: tf.train.adam(0.0005),
    loss: 'categoricalCrossentropy',
    metrics: ['accuracy']
  });
  
  return model;
}

function resample(arr, targetLen) {
  if (!arr || arr.length === 0) return null;
  if (arr.length === targetLen) return [...arr];
  
  const result = [];
  const step = arr.length / targetLen;
  for (let i = 0; i < targetLen; i++) {
    const idx = Math.min(Math.floor(i * step), arr.length - 1);
    result.push(arr[idx]);
  }
  return result;
}

function extractFeatures(sample) {
  const gx = resample(sample.gx, WINDOW_SIZE);
  const gy = resample(sample.gy, WINDOW_SIZE);
  const gz = resample(sample.gz, WINDOW_SIZE);
  const ax = resample(sample.ax || new Array(sample.gx.length).fill(0), WINDOW_SIZE);
  const ay = resample(sample.ay || new Array(sample.gx.length).fill(0), WINDOW_SIZE);
  const az = resample(sample.az || new Array(sample.gx.length).fill(0), WINDOW_SIZE);
  
  if (!gx || !gy || !gz) return null;
  
  const normalize = arr => {
    const max = Math.max(...arr.map(Math.abs)) || 1;
    return arr.map(v => v / max);
  };
  
  const nGx = normalize(gx);
  const nGy = normalize(gy);
  const nGz = normalize(gz);
  const nAx = normalize(ax);
  const nAy = normalize(ay);
  const nAz = normalize(az);
  
  // Flatten: [gx0,gy0,gz0,ax0,ay0,az0, ...]
  const features = [];
  for (let i = 0; i < WINDOW_SIZE; i++) {
    features.push(nGx[i], nGy[i], nGz[i], nAx[i], nAy[i], nAz[i]);
  }
  
  // Statistical features
  const stats = (arr) => {
    const sum = arr.reduce((a,b) => a+b, 0);
    const mean = sum / arr.length;
    const variance = arr.reduce((a,b) => a + (b-mean)**2, 0) / arr.length;
    return { mean, std: Math.sqrt(variance), max: Math.max(...arr) };
  };
  
  const gyroMag = gx.map((v, i) => Math.sqrt(v*v + gy[i]*gy[i] + gz[i]*gz[i]));
  const gStats = stats(gyroMag);
  
  const accelMag = ax.map((v, i) => Math.sqrt(v*v + ay[i]*ay[i] + az[i]*az[i]));
  const aStats = stats(accelMag);
  
  features.push(
    gStats.mean / 500, gStats.std / 500, gStats.max / 1000,
    aStats.mean / 4, aStats.std / 4, aStats.max / 8, // accel in g
    nGx.reduce((a,b) => a+b, 0) / WINDOW_SIZE,
    nGy.reduce((a,b) => a+b, 0) / WINDOW_SIZE,
    nGz.reduce((a,b) => a+b, 0) / WINDOW_SIZE,
    nAx.reduce((a,b) => a+b, 0) / WINDOW_SIZE,
    nAy.reduce((a,b) => a+b, 0) / WINDOW_SIZE,
    nAz.reduce((a,b) => a+b, 0) / WINDOW_SIZE
  );
  
  return features;
}

async function recognizeTF() {
  if (!tfModel || !modelLoaded) return null;
  
  const features = extractFeatures({
    gx: [...buffer.gx],
    gy: [...buffer.gy],
    gz: [...buffer.gz],
    ax: [...buffer.ax],
    ay: [...buffer.ay],
    az: [...buffer.az]
  });
  
  if (!features) return null;
  
  const input = tf.tensor2d([features]);
  const prediction = tfModel.predict(input);
  const probs = await prediction.data();
  input.dispose();
  prediction.dispose();
  
  // Find best and second best
  let maxIdx = 0, maxProb = 0, secondProb = 0;
  probs.forEach((p, i) => {
    if (p > maxProb) {
      secondProb = maxProb;
      maxProb = p;
      maxIdx = i;
    } else if (p > secondProb) {
      secondProb = p;
    }
  });
  
  const margin = maxProb - secondProb;
  
  return { 
    gesture: GESTURE_TYPES[maxIdx], 
    confidence: maxProb,
    margin: margin,
    isValid: maxProb >= CONFIDENCE_THRESHOLD && margin >= MARGIN_THRESHOLD
  };
}

// ══════════════════════════════════════════════════════════════════════════════
// MODEL LOADING
// ══════════════════════════════════════════════════════════════════════════════
async function loadModel(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const data = JSON.parse(e.target.result);
      
      if (data.type !== 'gesture_model_tf') {
        alert('Invalid model file! Use gesture_model_tf.json from TF trainer');
        return;
      }
      
      tfModel = createTFModel();
      
      // Load weights
      let layerIdx = 0;
      for (const layer of tfModel.layers) {
        if (data.weights[layerIdx] && data.weights[layerIdx].length > 0) {
          const tensors = data.weights[layerIdx].map(w => 
            tf.tensor(w.data, w.shape)
          );
          layer.setWeights(tensors);
          tensors.forEach(t => t.dispose());
        }
        layerIdx++;
      }
      
      modelLoaded = true;
      document.getElementById('dataset-btn').classList.add('loaded');
      document.getElementById('dataset-btn').textContent = t('modelLoaded');
      
    } catch(err) {
      console.error(err);
      alert('Error loading model: ' + err.message);
    }
  };
  reader.readAsText(file);
}

const BLE_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const BLE_CHAR_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

const CALIB = { 
  samples: [], collecting: false, done: false, 
  gxOff: 0, gyOff: 0, gzOff: 0,
  axOff: 0, ayOff: 0, azOff: 0
};

let isDetecting = false;
let motionStart = 0;
let lastRecognitionTime = 0;
const MOTION_THRESHOLD = 300;
const MOTION_END = 100;
const RECOGNITION_COOLDOWN = 400;

async function connectBLE() {
  if (!navigator.bluetooth) { alert('Web Bluetooth not supported'); return; }
  
  const btn = document.getElementById('ble-btn');
  btn.textContent = t('scanning');
  
  try {
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'FruitNinja' }],
      optionalServices: [BLE_SERVICE]
    });
    
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(BLE_SERVICE);
    const char = await service.getCharacteristic(BLE_CHAR_TX);
    
    await char.startNotifications();
    char.addEventListener('characteristicvaluechanged', onIMU);
    
    btn.classList.add('connected');
    btn.textContent = t('connected');
    CALIB.collecting = true;
    
  } catch(e) {
    console.error(e);
    btn.textContent = t('connectController');
  }
}

function onIMU(event) {
  let d;
  try { d = JSON.parse(new TextDecoder().decode(event.target.value)); } catch(e) { return; }
  
  const gx = d.gx || 0, gy = d.gy || 0, gz = d.gz || 0;
  const ax = d.ax || 0, ay = d.ay || 0, az = d.az || 0;
  
  // Calibration
  if (CALIB.collecting) {
    CALIB.samples.push({ gx, gy, gz, ax, ay, az });
    if (d.cal || CALIB.samples.length >= 100) {
      let sGx=0, sGy=0, sGz=0, sAx=0, sAy=0, sAz=0;
      CALIB.samples.forEach(s => { 
        sGx+=s.gx; sGy+=s.gy; sGz+=s.gz;
        sAx+=s.ax; sAy+=s.ay; sAz+=s.az;
      });
      const n = CALIB.samples.length;
      CALIB.gxOff = sGx/n; CALIB.gyOff = sGy/n; CALIB.gzOff = sGz/n;
      CALIB.axOff = sAx/n; CALIB.ayOff = sAy/n; CALIB.azOff = sAz/n - 1; // gravity in g
      CALIB.collecting = false;
      CALIB.done = true;
    }
    return;
  }
  
  if (!CALIB.done) return;
  
  const cgx = gx - CALIB.gxOff;
  const cgy = gy - CALIB.gyOff;
  const cgz = gz - CALIB.gzOff;
  const cax = ax - CALIB.axOff;
  const cay = ay - CALIB.ayOff;
  const caz = az - CALIB.azOff;
  const gyroMag = Math.sqrt(cgx*cgx + cgy*cgy + cgz*cgz);
  
  // Buffer (gyro + accel)
  buffer.gx.push(cgx); buffer.gy.push(cgy); buffer.gz.push(cgz);
  buffer.ax.push(cax); buffer.ay.push(cay); buffer.az.push(caz);
  while (buffer.gx.length > BUFFER_SIZE) {
    buffer.gx.shift(); buffer.gy.shift(); buffer.gz.shift();
    buffer.ax.shift(); buffer.ay.shift(); buffer.az.shift();
  }
  
  // Motion detection
  const now = performance.now();
  
  if (!isDetecting) {
    if (gyroMag > MOTION_THRESHOLD && now - lastRecognitionTime > RECOGNITION_COOLDOWN) {
      isDetecting = true;
      motionStart = now;
      peakEnergy = gyroMag;
    }
  } else {
    // Track peak energy
    if (gyroMag > peakEnergy) peakEnergy = gyroMag;
    
    const duration = now - motionStart;
    
    if (gyroMag < MOTION_END && duration > 80) {
      isDetecting = false;
      lastRecognitionTime = now;
      
      // Validate: enough energy and reasonable duration
      const isValidPunch = peakEnergy >= MIN_PEAK_ENERGY && duration >= 50 && duration <= 600;
      
      if (modelLoaded && isValidPunch) {
        recognizeTF().then(result => {
          if (result && result.isValid) {
            dealDamage(result.gesture);
          }
        });
      }
      
      peakEnergy = 0;
    } else if (duration > 500) {
      // Timeout
      isDetecting = false;
      peakEnergy = 0;
    }
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// ANIMATION LOOP
// ══════════════════════════════════════════════════════════════════════════════
let tick = 0;

function animate() {
  requestAnimationFrame(animate);
  tick++;
  
  // Update particles
  updateParticles();
  
  // Banana idle animation
  if (!gameOver) {
    bananaGroup.position.y = -0.4 + Math.sin(tick * 0.03) * 0.03;
    bananaGroup.rotation.y = Math.sin(tick * 0.02) * 0.05;
  }
  
  // Gloves idle sway
  if (!gloveState.left.punching) {
    leftPlayerGlove.position.y = 1 + Math.sin(tick * 0.04) * 0.03;
  }
  if (!gloveState.right.punching) {
    rightPlayerGlove.position.y = 1 + Math.sin(tick * 0.04 + Math.PI) * 0.03;
  }
  
  // Combo timeout check
  if (comboCount > 0 && performance.now() - lastComboTime > COMBO_TIMEOUT) {
    comboCount = 0;
    updateCombo();
  }
  
  renderer.render(scene, camera);
}

// Init
setLang('ru');
updateHP();
updateCombo();
animate();

// Make functions global for onclick handlers
window.setLang = setLang;
window.connectBLE = connectBLE;
window.loadModel = loadModel;
window.restartGame = restartGame;
</script>
